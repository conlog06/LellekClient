<!doctype html>
<html lang="de"><head><meta charset="utf-8" /><title>Minecraft-Logs – LellekClient</title>
<link rel="stylesheet" href="logwin.css" />
</head>
<body>
  <main class="lw">
    <section class="lw-main">
      <header class="lw-tools">
        <div class="lw-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Log durchsuchen …  (Strg+F)" spellcheck="false" /></div>
        <div class="lw-chips" id="chips">
          <button class="chip lv-error on" data-lv="error">FEHLER <b id="cError">0</b></button>
          <button class="chip lv-warn on" data-lv="warn">WARNUNG <b id="cWarn">0</b></button>
          <button class="chip lv-info on" data-lv="info">INFO</button>
          <button class="chip lv-debug" data-lv="debug">DEBUG</button>
        </div>
        <label class="lw-tg" title="Bekannte, harmlose Meldungen ausblenden (z. B. Skin-Signaturen von Servern)"><input type="checkbox" id="hideHarm" /> Harmlose ausblenden</label>
      </header>
      <div class="lw-hints hidden" id="hints"><button class="lw-hints-head" id="hintsHead"></button><div class="lw-hints-list" id="hintsList"></div></div>
      <div class="lw-progress hidden" id="prog"><div><span id="progText">Startet …</span><i><b id="progBar"></b></i></div></div>
      <div class="lw-log" id="log" tabindex="0"></div>
      <footer class="lw-foot">
        <span id="count">0 Zeilen</span>
        <button class="lnk on" id="follow" title="Automatisch zum Ende scrollen">↓ Mitlaufen</button>
        <span class="grow"></span>
        <button class="lnk" id="copy">Kopieren</button>
        <button class="lnk" id="clear">Leeren</button>
        <button class="lnk" id="upload" title="Log anonym auf mclo.gs hochladen und Link kopieren – zum Teilen bei Problemen">⇪ Hochladen (mclo.gs)</button>
      </footer>
    </section>
    <aside class="lw-side">
      <h2>Instanzen</h2>
      <div class="lw-list" id="list"><p class="muted">Noch kein Spielstart in dieser Sitzung.</p></div>
      <div class="lw-card hidden" id="card">
        <div class="lw-card-head"><b id="cardName"></b><span id="cardTime" class="ok"></span></div>
        <div class="lw-meter"><span>RAM</span><i><b id="ramBar"></b></i><em id="ramTxt">–</em></div>
        <div class="lw-meter"><span>CPU</span><i><b id="cpuBar"></b></i><em id="cpuTxt">–</em></div>
        <div class="lw-card-btns"><button class="stop" id="stop">■ Beenden</button><button id="folder" title="Instanz-Ordner öffnen">📁</button><button id="files" title="Log-Dateien">🗎</button></div>
      </div>
      <p class="lw-run muted" id="runCount"></p>
    </aside>
  </main>
  <div class="lw-toast hidden" id="toast"></div>
  <script src="logwin.js"></script>
</body></html>
