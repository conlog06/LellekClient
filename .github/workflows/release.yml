# Baut LellekClient für Windows und macOS und veröffentlicht ein GitHub-Release.
# Auslösen: Version in package.json erhöhen und auf main pushen – gibt es für diese Version
# noch kein Release, wird gebaut und veröffentlicht. Alternativ: Actions → Release → „Run workflow“.
name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

  windows:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Datei umbenennen
        shell: bash
        run: |
          mkdir out
          cp dist/*Setup*.exe out/LellekClient-Setup-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  mac:
    needs: check
    if: needs.check.outputs.exists != 'true'
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --mac dir --arm64 --x64 --publish never
      - name: Ad-hoc signieren, ZIP und DMG bauen
        run: |
          mkdir out
          for pair in "mac-arm64:AppleSilicon" "mac:Intel"; do
            dir="${pair%%:*}"; name="${pair##*:}"; app="dist/$dir/LellekClient.app"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            ditto -c -k --sequesterRsrc --keepParent "$app" "out/LellekClient-Mac-$name.zip"
            stage="dmg-$name"; mkdir "$stage"; cp -R "$app" "$stage/"; ln -s /Applications "$stage/Programme"
            hdiutil create -volname "LellekClient" -srcfolder "$stage" -ov -format UDZO "out/LellekClient-Mac-$name.dmg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: out/*

  release:
    needs: [check, windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Prüfsummen
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: LellekClient ${{ needs.check.outputs.version }}
          body_path: RELEASE_NOTES.md
          make_latest: 'true'
          files: out/*
